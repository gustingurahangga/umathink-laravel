name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        run: npm run build

      - name: Create deployment archive
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="storage" \
            --exclude="vendor" \
            --exclude="node_modules" \
            -czf "$RUNNER_TEMP/deploy.tar.gz" .

      - name: Upload deployment archive
        uses: appleboy/scp-action@v1
        with:
          host: 153.92.13.29
          username: rumahp25
          port: 65002
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: "SHA256:O15G+HkYibs2OMPrSFtCJP6J8cO/GfDdkS/SyZVky4s"
          source: "${{ runner.temp }}/deploy.tar.gz"
          target: "/home/rumahp25"

      - name: Extract and update Laravel
        uses: appleboy/ssh-action@v1
        with:
          host: 153.92.13.29
          username: rumahp25
          port: 65002
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: "SHA256:O15G+HkYibs2OMPrSFtCJP6J8cO/GfDdkS/SyZVky4s"
          script: |
            set -e

            cd /home/rumahp25/public_html/umathink-laravel

            tar -xzf /home/rumahp25/deploy.tar.gz -C /home/rumahp25/public_html/umathink-laravel

            rm -f /home/rumahp25/deploy.tar.gz

            composer install --no-dev --optimize-autoloader

            php artisan optimize:clear
            php artisan optimize
